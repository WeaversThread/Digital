# Glass: white at varying opacities on dark glass.
# Tokens are pre-blended onto #1E1E1E (see de.neemann.gui.Glass):
#   primary .85 #DDDDDD   secondary .7 #BCBCBC   tertiary .45 #838383   quaternary .35 #6D6D6D
#   muted .25 #565656     selected .14 #3E3E3E    subtle .12 #393939     surface .08 #303030
#   surface-dim .06 #2C2C2C   faint .04 #272727

@background = #1E1E1E
@foreground = #DDDDDD
@disabledForeground = #565656
@accentColor = #BCBCBC
@selectionBackground = #3E3E3E
@selectionForeground = #DDDDDD
@selectionInactiveBackground = #333333
@selectionInactiveForeground = #DDDDDD
@componentBackground = #303030
@buttonBackground = #303030
@menuBackground = #262626
@cellFocusColor = #565656

#---- custom UIs ----
ButtonUI = de.neemann.gui.GlassButtonUI

#---- shared ----
Component.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.focusColor = #393939
Component.focusedBorderColor = #565656
Component.borderColor = #393939
Component.disabledBorderColor = #2C2C2C
Component.error.borderColor = #FF453A
Component.error.focusedBorderColor = #FF453A
Component.hideMnemonics = true
Separator.foreground = #303030
Label.disabledForeground = #565656

#---- buttons: capsules ----
Button.arc = 999
Button.background = #303030
Button.foreground = #DDDDDD
Button.hoverBackground = #393939
Button.pressedBackground = #3E3E3E
Button.borderColor = #303030
Button.hoverBorderColor = #393939
Button.focusedBorderColor = #565656
Button.disabledBorderColor = #272727
Button.disabledBackground = #272727
Button.default.background = #DDDDDD
Button.default.foreground = #1E1E1E
Button.default.hoverBackground = #EEEEEE
Button.default.pressedBackground = #FFFFFF
Button.default.borderColor = #DDDDDD
Button.default.hoverBorderColor = #EEEEEE
Button.default.focusedBorderColor = #DDDDDD
Button.default.focusColor = #393939
Button.default.boldText = false
Button.toolbar.hoverBackground = @background
Button.toolbar.pressedBackground = #303030
Button.toolbar.selectedBackground = #3E3E3E
Button.toolbar.margin = 6,6,6,6
Button.toolbar.spacingInsets = 1,2,1,2
ToggleButton.background = #303030
ToggleButton.selectedBackground = #3E3E3E
ToggleButton.toolbar.hoverBackground = @background
ToggleButton.toolbar.selectedBackground = #3E3E3E

#---- toolbar ----
ToolBar.background = @background
ToolBar.borderMargins = 0,0,0,0
ToolBar.separatorWidth = 14
ToolBar.separatorColor = @background
ToolBar.floatable = false

#---- check boxes and radio buttons: white when on, like GlassSwitch ----
CheckBox.arc = 6
CheckBox.icon.background = #303030
CheckBox.icon.borderColor = #393939
CheckBox.icon.hoverBorderColor = #565656
CheckBox.icon.focusedBorderColor = #565656
CheckBox.icon.selectedBackground = #BCBCBC
CheckBox.icon.selectedBorderColor = #BCBCBC
CheckBox.icon.checkmarkColor = #1E1E1E
CheckBox.icon.disabledBackground = #272727
CheckBox.icon.disabledBorderColor = #2C2C2C
CheckBox.icon.disabledCheckmarkColor = #565656
RadioButton.icon.centerDiameter = 6

#---- text fields, combo boxes, spinners ----
TextComponent.arc = 8
TextField.background = #303030
FormattedTextField.background = #303030
PasswordField.background = #303030
TextArea.background = #272727
TextPane.background = #272727
EditorPane.background = #1E1E1E
ComboBox.background = #303030
ComboBox.buttonBackground = #303030
ComboBox.buttonEditableBackground = #303030
ComboBox.buttonArrowColor = #838383
ComboBox.buttonHoverArrowColor = #DDDDDD
ComboBox.buttonSeparatorColor = #303030
ComboBox.popupBackground = #262626
ComboBox.selectionBackground = #3E3E3E
Spinner.background = #303030
Spinner.buttonBackground = #303030
Spinner.buttonArrowColor = #838383
Spinner.buttonHoverArrowColor = #DDDDDD
Spinner.buttonSeparatorColor = #303030

#---- menus and popups ----
PopupMenu.background = #262626
PopupMenu.borderColor = #393939
PopupMenu.borderCornerRadius = 10
Popup.borderCornerRadius = 10
MenuItem.selectionBackground = #3E3E3E
MenuItem.acceleratorForeground = #6D6D6D
MenuItem.acceleratorSelectionForeground = #838383
Menu.selectionBackground = #3E3E3E
MenuItem.selectionArc = 6

#---- tooltips ----
ToolTip.background = #2C2C2C
ToolTip.foreground = #DDDDDD
ToolTip.border = 6,10,6,10,#393939,1,8

#---- scroll bars: thin, no buttons, hover to brighten ----
ScrollBar.width = 10
ScrollBar.minimumThumbSize = 10,30
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.trackArc = 999
ScrollBar.showButtons = false
ScrollBar.track = @background
ScrollBar.hoverTrackColor = @background
ScrollBar.thumb = #393939
ScrollBar.hoverThumbColor = #565656
ScrollBar.pressedThumbColor = #6D6D6D
ScrollPane.border = 0,0,0,0
ScrollPane.background = @background

#---- tabs: weight by color, no underline ----
TabbedPane.foreground = #6D6D6D
TabbedPane.selectedForeground = #DDDDDD
TabbedPane.hoverColor = #272727
TabbedPane.focusColor = @background
TabbedPane.selectedBackground = @background
TabbedPane.underlineColor = #BCBCBC
TabbedPane.inactiveUnderlineColor = #565656
TabbedPane.tabSelectionHeight = 1
TabbedPane.contentAreaColor = #303030
TabbedPane.tabHeight = 30
TabbedPane.showTabSeparators = false

#---- tables, trees, lists ----
Table.background = @background
Table.alternateRowColor = #222222
Table.gridColor = #2C2C2C
Table.selectionBackground = #3E3E3E
Table.selectionInactiveBackground = #333333
Table.cellFocusColor = #565656
TableHeader.background = @background
TableHeader.foreground = #838383
TableHeader.separatorColor = #2C2C2C
TableHeader.bottomSeparatorColor = #303030
Tree.background = @background
Tree.selectionBackground = #3E3E3E
Tree.selectionInactiveBackground = #333333
Tree.icon.expandedColor = #6D6D6D
Tree.icon.collapsedColor = #6D6D6D
Tree.icon.leafColor = #6D6D6D
Tree.icon.closedColor = #6D6D6D
Tree.icon.openColor = #6D6D6D
Tree.paintLines = false
Tree.rowHeight = 0
List.background = @background

#---- split panes ----
SplitPane.background = @background
SplitPane.dividerSize = 5
SplitPaneDivider.gripColor = #393939
SplitPaneDivider.draggingColor = #393939
SplitPaneDivider.oneTouchArrowColor = #6D6D6D
SplitPaneDivider.style = plain

#---- progress, slider ----
ProgressBar.arc = 999
ProgressBar.background = #303030
ProgressBar.foreground = #BCBCBC
ProgressBar.selectionForeground = #1E1E1E
ProgressBar.selectionBackground = #DDDDDD
Slider.trackColor = #393939
Slider.trackValueColor = #BCBCBC
Slider.thumbColor = #DDDDDD
Slider.focusedColor = #393939
Slider.hoverThumbColor = #EEEEEE

#---- option panes, titled borders ----
TitledBorder.titleColor = #838383
TitledBorder.border = 1,1,1,1,#303030
Hyperlink.linkColor = #BCBCBC
